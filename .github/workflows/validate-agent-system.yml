name: Validate Agentic Web Design OS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/code_quality.py
      - run: python tools/validate_system.py
      - run: python tools/validate_gate.py --all-projects --approved-only
      - run: python tools/audit_state.py --all-projects
      - run: python tools/validate_resource_registry.py
      - run: python tools/validate_design_capabilities.py
      - run: python tools/audit_system.py
      - run: python tools/audit_agents.py
      - run: git diff --exit-code -- docs/audit/generated-agent-contract-audit.md
      - run: python -m unittest discover -s tests -v
